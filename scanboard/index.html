<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Winpost ScanBoard</title>
  <style>
    :root {
      --bg:#09090b; --card:#141416; --card2:#0f0f11; --line:#2a2a2f;
      --text:#f5f5f6; --muted:#96969f; --green:#8de0b5; --green-bg:#163528;
      --danger:#ff8e8e; --danger-bg:#3b1818;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    button,input,textarea{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .shell{max-width:980px;margin:0 auto;padding:18px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}
    .brand h1{margin:0;font-size:26px;letter-spacing:-.02em}
    .brand p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
    .gate{max-width:520px;margin:64px auto 0}
    .gate h2{margin:0 0 8px;font-size:22px}
    .gate p{margin:0 0 18px;color:var(--muted);line-height:1.45}
    .code-input{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:13px;outline:none;text-transform:uppercase;letter-spacing:.12em;text-align:center;font-weight:800}
    .code-row{display:flex;gap:8px;align-items:stretch}
    .code-row .code-input{flex:1;min-width:0}
    .paste-btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:0 14px;font-weight:750;cursor:pointer;white-space:nowrap}
    .paste-btn.ok{background:var(--green-bg);border-color:#2f8f61;color:var(--green)}
    .primary{width:100%;margin-top:10px;border:0;background:#f4f4f5;color:#0a0a0b;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}
    .status{margin-top:12px;color:var(--muted);font-size:13px;min-height:18px}
    .error{color:#ff9a9a}
    .hidden{display:none!important}
    .tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch}
    .tab-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:11px;padding:10px 13px;font-weight:700;white-space:nowrap;cursor:pointer}
    .tab-btn.active{background:#f4f4f5;color:#0a0a0b;border-color:#f4f4f5}
    .giveaway{display:none}
    .giveaway.active{display:block}
    .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:10px}
    .hero h2{margin:8px 0 0;font-size:21px;line-height:1.2}
    .badge{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--green-bg);color:var(--green);font-size:11px;font-weight:800;letter-spacing:.06em}
    .copy-all,.copy-btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:9px 11px;font-size:12px;font-weight:750;cursor:pointer;white-space:nowrap}
    .field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0}
    .field-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .label{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
    .value{width:100%;background:var(--card2);color:var(--text);border:1px solid #242428;border-radius:10px;padding:10px 11px;line-height:1.45;resize:none;overflow:hidden}
    .plain{white-space:pre-wrap;line-height:1.45}
    .copy-btn.ok,.copy-all.ok{background:var(--green-bg);border-color:#2f8f61;color:var(--green)}
    .actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
    .action-buttons{display:flex;gap:10px;align-items:center}
    .import-btn{border:0;background:#f4f4f5;color:#0a0a0b;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;white-space:nowrap}
    .import-btn:disabled{opacity:.55;cursor:default}
    .danger{border:1px solid #673030;background:var(--danger-bg);color:var(--danger);border-radius:11px;padding:10px 12px;font-weight:750;cursor:pointer}
    .muted{color:var(--muted);font-size:12px}
    .empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
    .toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;pointer-events:none;background:var(--green-bg);border:1px solid #2f8f61;color:var(--green);padding:9px 13px;border-radius:999px;font-size:13px;font-weight:800;transition:.18s ease;z-index:100}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:640px){.shell{padding:14px}.brand h1{font-size:23px}.hero{padding:14px}.hero h2{font-size:19px}.actions{align-items:stretch;flex-direction:column}.action-buttons{width:100%;flex-direction:column}.import-btn,.danger{width:100%}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <h1>Winpost ScanBoard</h1>
        <p id="subtitle">Private giveaway workspace</p>
      </div>
    </div>
    <section id="codeView" class="gate card hidden">
      <h2>Enter access code</h2>
      <p>Use the code ChatGPT gave you with this ScanBoard link.</p>
      <div class="code-row">
        <input id="codeInput" class="code-input" inputmode="text" autocomplete="one-time-code" placeholder="XXXX-XXXX" maxlength="16">
        <button id="pasteBtn" class="paste-btn" type="button">Paste</button>
      </div>
      <button id="unlockBtn" class="primary">Open ScanBoard</button>
      <div id="codeStatus" class="status"></div>
    </section>
    <section id="loadingView" class="card">Loading…</section>

    <section id="boardView" class="hidden">
      <div id="tabs" class="tabs"></div>
      <div id="panels"></div>
      <div class="actions">
        <div class="muted">Private to this browser session and protected by Supabase RLS.</div>
        <div class="action-buttons">
          <button id="importBtn" class="import-btn">Import to Winpost</button>
          <button id="deleteBtn" class="danger">Clear &amp; delete ScanBoard</button>
        </div>
      </div>
    </section>

    <section id="emptyView" class="empty hidden">No ScanBoard loaded.</section>
  </div>
  <div id="toast" class="toast">Copied ✓</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://bibeipatouqketdwicad.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_CV9hOkHGePlDt9tcNTRZaA_tphrHDJQ';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false
      }
    });
    const PBKDF2_ITERATIONS = 250000;
    const IMPORT_TOKEN_TTL_MS = 10 * 60 * 1000;
    const els = {
      codeView: document.getElementById('codeView'),
      loadingView: document.getElementById('loadingView'),
      boardView: document.getElementById('boardView'),
      emptyView: document.getElementById('emptyView'),
      codeInput: document.getElementById('codeInput'),
      pasteBtn: document.getElementById('pasteBtn'),
      unlockBtn: document.getElementById('unlockBtn'),
      codeStatus: document.getElementById('codeStatus'),
      subtitle: document.getElementById('subtitle'),
      tabs: document.getElementById('tabs'),
      panels: document.getElementById('panels'),
      importBtn: document.getElementById('importBtn'),
      deleteBtn: document.getElementById('deleteBtn'),
      toast: document.getElementById('toast')
    };
    let currentBoard = null;
    let encryptedSeed = null;

    function setOnly(view) {
      [els.codeView, els.loadingView, els.boardView, els.emptyView].forEach(v => v.classList.add('hidden'));
      view.classList.remove('hidden');
    }

    function showToast(msg='Copied ✓') {
      els.toast.textContent = msg;
      els.toast.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => els.toast.classList.remove('show'), 1100);
    }
    function normalizeCode(code) {
      return code.toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    function b64urlToBytes(s) {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      const raw = atob(s);
      const out = new Uint8Array(raw.length);
      for (let i=0; i<raw.length; i++) out[i] = raw.charCodeAt(i);
      return out;
    }
    function bytesToB64url(bytes) {
      let raw = '';
      bytes.forEach(byte => raw += String.fromCharCode(byte));
      return btoa(raw).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }
    function parseSeed() {
      const hash = location.hash || '';
      const m = hash.match(/^#v1=([^.]+)\.([^.]+)\.([^.]+)$/);
      if (!m) return null;
      return {
        salt: b64urlToBytes(m[1]),
        iv: b64urlToBytes(m[2]),
        ciphertext: b64urlToBytes(m[3])
      };
    }
    async function deriveKey(code, salt) {
      const enc = new TextEncoder();
      const material = await crypto.subtle.importKey(
        'raw',
        enc.encode(normalizeCode(code)),
        {name:'PBKDF2'},
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        {
          name:'PBKDF2',
          salt,
          iterations:PBKDF2_ITERATIONS,
          hash:'SHA-256'
        },
        material,
        {
          name:'AES-GCM',
          length:256
        },
        false,
        ['decrypt']
      );
    }
    async function decryptPayload(seed, code) {
      const key = await deriveKey(code, seed.salt);
      const plain = await crypto.subtle.decrypt(
        {name:'AES-GCM', iv:seed.iv},
        key,
        seed.ciphertext
      );
      const text = new TextDecoder().decode(plain);
      const payload = JSON.parse(text);
      if (!payload || !Array.isArray(payload.giveaways)) throw new Error('Invalid payload');
      return payload;
    }
    async function ensureSession() {
      let { data: { session } } = await sb.auth.getSession();
      if (session) return session;

      const { data, error } = await sb.auth.signInAnonymously();
      if (error) throw error;
      return data.session;
    }

    async function createBoard(payload) {
      await ensureSession();

      const { data, error } = await sb
        .from('scanboards')
        .insert({ data: payload })
        .select('id,data,created_at,expires_at')
        .single();
      if (error) throw error;

      currentBoard = data;
      history.replaceState(null, '', location.pathname + '?id=' + encodeURIComponent(data.id));
      return data;
    }

    async function loadBoardById(id) {
      await ensureSession();

      const { data, error } = await sb
        .from('scanboards')
        .select('id,data,created_at,expires_at')
        .eq('id', id)
        .single();
      if (error) {
        if (error.code === 'PGRST116') return null;
        throw error;
      }
      return data;
    }

    function rowsFor(text) {
      return Math.min(8, Math.max(2, Math.ceil(String(text).length / 58)));
    }
    async function copyText(text, sourceEl) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        try {
          sourceEl.focus();
          if (typeof sourceEl.select === 'function') sourceEl.select();
          if (typeof sourceEl.setSelectionRange === 'function') sourceEl.setSelectionRange(0, sourceEl.value.length);
          return !!document.execCommand('copy');
        } catch (_) {
          return false;
        }
      }
    }
    function makeField(label, value, copyable=true) {
      const wrap = document.createElement('div');
      wrap.className = 'field';

      const head = document.createElement('div');
      head.className = 'field-head';

      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = label;
      head.appendChild(lab);
      let valueEl;
      if (copyable) {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.type = 'button';
        btn.textContent = 'Copy';
        head.appendChild(btn);

        valueEl = document.createElement('textarea');
        valueEl.className = 'value';
        valueEl.readOnly = true;
        valueEl.rows = rowsFor(value);
        valueEl.value = value ?? '';
        btn.addEventListener('click', async () => {
          const ok = await copyText(valueEl.value, valueEl);
          if (ok) {
            btn.textContent = 'Copied ✓';
            btn.classList.add('ok');
            showToast();
            setTimeout(() => {
              btn.textContent = 'Copy';
              btn.classList.remove('ok');
            }, 1000);
          } else {
            showToast('Text selected — use Copy');
          }
        });
      } else {
        valueEl = document.createElement('div');
        valueEl.className = 'plain';
        valueEl.textContent = value ?? '';
      }
      wrap.appendChild(head);
      wrap.appendChild(valueEl);
      return wrap;
    }

    function normalizeGiveaway(g, i) {
      return {
        tab: g.tab || g.prize_title || g.title || `Giveaway ${i+1}`,
        badge: g.badge || g.who_can_enter || '',
        title: g.title || g.original_title || g.prize_title || `Giveaway ${i+1}`,
        fields: Array.isArray(g.fields) ? g.fields : []
      };
    }
    function renderBoard(board) {
      currentBoard = board;
      els.tabs.innerHTML = '';
      els.panels.innerHTML = '';

      const giveaways = (board?.data?.giveaways || []).map(normalizeGiveaway);
      if (!giveaways.length) {
        setOnly(els.emptyView);
        return;
      }

      els.subtitle.textContent = `${giveaways.length} approved giveaway${giveaways.length === 1 ? '' : 's'}`;
      giveaways.forEach((g, idx) => {
        const tab = document.createElement('button');
        tab.className = 'tab-btn' + (idx === 0 ? ' active' : '');
        tab.textContent = g.tab;
        tab.type = 'button';
        els.tabs.appendChild(tab);

        const panel = document.createElement('section');
        panel.className = 'giveaway' + (idx === 0 ? ' active' : '');

        const hero = document.createElement('div');
        hero.className = 'hero';
        const heroText = document.createElement('div');
        if (g.badge) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = g.badge;
          heroText.appendChild(badge);
        }
        const h2 = document.createElement('h2');
        h2.textContent = g.title;
        heroText.appendChild(h2);
        const copyAll = document.createElement('button');
        copyAll.className = 'copy-all';
        copyAll.type = 'button';
        copyAll.textContent = 'Copy all';

        hero.appendChild(heroText);
        hero.appendChild(copyAll);
        panel.appendChild(hero);
        const renderedFields = [];
        g.fields.forEach(f => {
          const label = f.label ?? '';
          const value = f.value ?? '';
          const copyable = f.copyable !== false;
          panel.appendChild(makeField(label, value, copyable));
          renderedFields.push({label, value});
        });
        copyAll.addEventListener('click', async () => {
          const all = renderedFields.map(f => `${f.label}\n${f.value}`).join('\n\n');
          const temp = document.createElement('textarea');
          temp.value = all;
          temp.style.position = 'fixed';
          temp.style.left = '-9999px';
          document.body.appendChild(temp);
          const ok = await copyText(all, temp);
          temp.remove();
          if (ok) {
            copyAll.textContent = 'Copied ✓';
            copyAll.classList.add('ok');
            showToast();
            setTimeout(() => {
              copyAll.textContent = 'Copy all';
              copyAll.classList.remove('ok');
            }, 1000);
          } else {
            showToast('Copy failed');
          }
        });
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
          document.querySelectorAll('.giveaway').forEach(x => x.classList.remove('active'));
          tab.classList.add('active');
          panel.classList.add('active');
        });

        els.panels.appendChild(panel);
      });

      setOnly(els.boardView);
    }

    async function pasteAccessCode() {
      els.codeStatus.classList.remove('error');
      try {
        if (!navigator.clipboard || !navigator.clipboard.readText) {
          throw new Error('Clipboard API unavailable');
        }

        const clipboardText = await navigator.clipboard.readText();
        const cleaned = clipboardText
          .toUpperCase()
          .replace(/[^A-Z0-9]/g, '')
          .slice(0, 8);
        if (!cleaned) {
          els.codeStatus.textContent = 'Clipboard does not contain a valid code.';
          els.codeStatus.classList.add('error');
          return;
        }

        const formatted = cleaned.length > 4
          ? cleaned.slice(0, 4) + '-' + cleaned.slice(4)
          : cleaned;

        els.codeInput.value = formatted;
        els.pasteBtn.textContent = 'Pasted ✓';
        els.pasteBtn.classList.add('ok');
        els.codeStatus.textContent = '';
        setTimeout(() => {
          els.pasteBtn.textContent = 'Paste';
          els.pasteBtn.classList.remove('ok');
        }, 1000);
      } catch (e) {
        els.codeInput.focus();
        els.codeStatus.textContent = 'Clipboard access is blocked here. Hold the field and tap Paste.';
      }
    }
    async function unlockSeed() {
      const code = els.codeInput.value.trim();
      if (!code) {
        els.codeStatus.textContent = 'Enter the code first.';
        els.codeStatus.classList.add('error');
        return;
      }

      els.unlockBtn.disabled = true;
      els.codeStatus.classList.remove('error');
      els.codeStatus.textContent = 'Opening…';
      try {
        const payload = await decryptPayload(encryptedSeed, code);
        const board = await createBoard(payload);
        els.codeInput.value = '';
        renderBoard(board);
      } catch (e) {
        console.error(e);
        els.codeStatus.textContent = e?.message?.includes('anonymous_provider_disabled')
          ? 'Anonymous sign-ins are disabled in Supabase.'
          : 'Wrong code or the ScanBoard link is invalid.';
        els.codeStatus.classList.add('error');
      } finally {
        els.unlockBtn.disabled = false;
      }
    }

    async function importCurrentBoard() {
      if (!currentBoard?.id || !Array.isArray(currentBoard?.data?.giveaways) || !currentBoard.data.giveaways.length) {
        showToast('Nothing to import');
        return;
      }

      els.importBtn.disabled = true;
      const originalLabel = els.importBtn.textContent;
      els.importBtn.textContent = 'Preparing…';
      try {
        await ensureSession();
        const tokenBytes = new Uint8Array(32);
        crypto.getRandomValues(tokenBytes);
        const token = bytesToB64url(tokenBytes);
        const expiresAt = new Date(Date.now() + IMPORT_TOKEN_TTL_MS).toISOString();

        const { error } = await sb
          .from('scanboards')
          .update({ import_token: token, import_expires_at: expiresAt })
          .eq('id', currentBoard.id);
        if (error) throw error;

        els.importBtn.textContent = 'Opening Winpost…';
        showToast('Opening Winpost…');
        window.location.href = `winpost://scanboard-import?token=${encodeURIComponent(token)}`;
      } catch (e) {
        console.error(e);
        alert(e?.message || 'Could not prepare this ScanBoard for Winpost.');
      } finally {
        setTimeout(() => {
          els.importBtn.disabled = false;
          els.importBtn.textContent = originalLabel;
        }, 1200);
      }
    }

    async function deleteCurrentBoard() {
      if (!currentBoard?.id) return;
      if (!confirm('Delete this ScanBoard permanently?')) return;

      els.deleteBtn.disabled = true;
      const { error } = await sb.from('scanboards').delete().eq('id', currentBoard.id);
      els.deleteBtn.disabled = false;

      if (error) {
        alert(error.message);
        return;
      }
      currentBoard = null;
      history.replaceState(null, '', location.pathname);
      els.tabs.innerHTML = '';
      els.panels.innerHTML = '';
      els.subtitle.textContent = 'Private giveaway workspace';
      els.emptyView.textContent = 'ScanBoard deleted.';
      setOnly(els.emptyView);
    }

    async function boot() {
      encryptedSeed = parseSeed();

      if (encryptedSeed) {
        setOnly(els.codeView);
        setTimeout(() => els.codeInput.focus(), 150);
        return;
      }
      const id = new URLSearchParams(location.search).get('id');
      if (!id) {
        setOnly(els.emptyView);
        return;
      }

      setOnly(els.loadingView);
      try {
        const board = await loadBoardById(id);
        if (board) renderBoard(board);
        else {
          els.emptyView.textContent = 'This ScanBoard is unavailable in this browser session or has been deleted.';
          setOnly(els.emptyView);
        }
      } catch (e) {
        console.error(e);
        els.emptyView.innerHTML = '<span class="error">Could not load ScanBoard.</span>';
        setOnly(els.emptyView);
      }
    }
    els.pasteBtn.addEventListener('click', pasteAccessCode);
    els.unlockBtn.addEventListener('click', unlockSeed);
    els.codeInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') unlockSeed();
    });
    els.importBtn.addEventListener('click', importCurrentBoard);
    els.deleteBtn.addEventListener('click', deleteCurrentBoard);

    boot();
  </script>
</body>
</html>
